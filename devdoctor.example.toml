# Copy to devdoctor.toml (auto-discovered in the current directory) or pass --config.
[python]
min_version = "3.10"
require_venv = true

[disk]
path = "."
min_free_gb = 2
warn_free_gb = 10

[env]
required = ["PATH", "HOME"]
recommended = ["EDITOR"]

[[tools]]
name = "git"
required = true
min_version = "2.30"

[[tools]]
name = "node"
min_version = "18.0"

[[tools]]
name = "docker"
