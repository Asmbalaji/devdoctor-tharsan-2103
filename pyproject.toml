[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "devdoctor"
version = "0.1.0"
description = "Deterministic developer-environment health report (human-readable + JSON)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
devdoctor = "devdoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
